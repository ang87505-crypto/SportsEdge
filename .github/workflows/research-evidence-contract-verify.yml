# Unit-only verification for an isolated, read-only research prototype.
# No account, market, provider, database or production changes.
name: Research evidence timeline contract verification
on:
  pull_request:
    paths:
      - 'research/contracts/evidence-v1.mjs'
      - 'research/contracts/evidence-v1.test.mjs'
      - 'docs/SPORTSEDGE_EVIDENCE_CONTRACT_2026_11_13.md'
      - '.github/workflows/research-evidence-contract-verify.yml'
permissions:
  contents: read
jobs:
  pure-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify no-lookahead, unknown status, source rights and virtual receipt lineage
        run: node --test research/contracts/evidence-v1.test.mjs
      - name: Assert the original evidence prototype is not modifying production files
        if: github.event.pull_request.head.ref == 'research/evidence-contract-v1-20261113'
        run: |
          git fetch --no-tags origin main
          ! git diff --name-only origin/main...HEAD | grep -Ev '^(research/contracts/evidence-v1(\.test)?\.mjs|docs/SPORTSEDGE_EVIDENCE_CONTRACT_2026_11_13\.md|\.github/workflows/research-evidence-contract-verify\.yml)$'
