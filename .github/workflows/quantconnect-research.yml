name: QuantConnect frozen selector parity (offline)
on:
  push:
    branches: ['research/quantconnect-selector-parity-20261013']
  pull_request:
    paths:
      - 'integrations/quantconnect/**'
      - '.github/workflows/quantconnect-research.yml'
      - 'analytics/stock_momentum_v1.py'
      - 'analytics/stock_rank_buffer_candidate.py'
      - 'analytics/test_stock_momentum_v1.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-selector-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile port and test against original frozen source
        run: |
          python -m compileall -q integrations/quantconnect
          python -m unittest discover -s integrations/quantconnect -p 'test_*.py' -v
