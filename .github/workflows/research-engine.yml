# AI 2.0 learning engine (research only). MANUAL DISPATCH ONLY until the owner approves a schedule after the Monday
# 2026-11-16 release. Proposed schedule once approved (not active): '23 12 * * 2' (Tuesdays, after the weekly settle).
# Reads graded props outcomes with GET requests only, checks data quality, measures patterns with clustered intervals,
# proposes at most 2 new hypotheses per domain, and uploads a report and an updated registry COPY as an artifact.
# It never writes to a database, never calls a provider, broker or AI service, and cannot change a model, pick, entry,
# stake, budget, schedule or order. A failure here cannot affect the props capture or the stock worker (separate jobs).
name: Research engine (AI 2.0, manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-engine
  cancel-in-progress: false
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Engine tests before any credential is provided
        run: node --experimental-strip-types --test src/lib/lab/engine/*.test.mjs
      - name: Diagnose graded outcomes and propose hypotheses (read-only)
        env:
          SPORTSEDGE_PROPS_SUPABASE_URL: ${{ secrets.SPORTSEDGE_PROPS_SUPABASE_URL }}
          SPORTSEDGE_PROPS_SUPABASE_SERVICE_KEY: ${{ secrets.SPORTSEDGE_PROPS_SUPABASE_SERVICE_KEY }}
        run: |
          set -o pipefail
          node --experimental-strip-types --no-warnings scripts/research-engine.ts --registry research/engine/registry.json \
            --out "$RUNNER_TEMP/engine" --sports-ledger | tee -a "$GITHUB_STEP_SUMMARY"
          node -e "const r=require(process.argv[1]);const s=r.domains.sports;console.log(JSON.stringify({picks:s?.picks,quality:s?.qualityIssues,patterns:(s?.patterns??[]).map(p=>[p.id,p.n,p.effect,p.lower95,p.upper95,p.significant]),proposed:(s?.proposed??[]).map(h=>h.key),skipped:s?.skipped},null,1))" "$RUNNER_TEMP/engine/report.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-engine-${{ github.run_id }}
          path: ${{ runner.temp }}/engine/
          if-no-files-found: ignore
          retention-days: 30
