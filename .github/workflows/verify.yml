name: Verify SportsEdge

on:
  pull_request:
  push:
    branches:
      - audit-six-month-backtest

permissions:
  contents: read

# Only newer commits on the same PR supersede an in-progress verification.
# Push/manual runs get their own group and cannot cancel unrelated checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python statistics and audit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run deterministic analytics tests
        run: python -m unittest discover -s analytics -p 'test_*.py' -v

  website:
    name: Next.js lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify realized-only chart arithmetic
        run: node --experimental-strip-types --test src/lib/performance-series.test.mjs
      - name: Validate journal import safety
        run: node --experimental-strip-types --test src/lib/stocks/journal.test.mjs src/lib/stocks/journal-backup.test.mjs
      - name: Check stock PAPER dashboard diagnostic safety
        run: node --experimental-strip-types --test src/lib/stocks/alpaca-paper-ui-diagnostics.test.mjs src/components/alpaca-paper-ui-guard.test.mjs
      - name: Lint code
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Typecheck generated route types
        run: npx tsc --noEmit
