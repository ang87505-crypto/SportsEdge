name: Verify SportsEdge

on:
  pull_request:
  push:
    branches:
      - main
      - audit-six-month-backtest

permissions:
  contents: read

# A newer push to the same PR supersedes the older run; pushes to main always finish.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python statistics and audit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run deterministic analytics tests
        run: python -m unittest discover -s analytics -p 'test_*.py' -v

  website:
    name: Next.js lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run all JavaScript and TypeScript unit tests
        run: npm test
      - name: Typecheck with generated Next route types
        run: npx next typegen && npx tsc --noEmit
      - name: Lint code
        run: npm run lint
      - name: Production build
        run: npm run build
