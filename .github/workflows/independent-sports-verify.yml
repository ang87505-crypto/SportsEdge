# Synthetic-only verification. Never downloads sportsbooks, modifies an active
# bankroll, places orders or runs collector against external providers in CI.
name: Independent NFL NHL source research verification
on:
  pull_request:
    paths:
      - 'scripts/independent-sports-collect.mjs'
      - 'scripts/independent-sports-collect.test.mjs'
      - '.github/workflows/independent-sports-verify.yml'
      - '.github/workflows/independent-sports-memory.yml'
      - 'docs/INDEPENDENT_SPORTS_MEMORY_2026_11_13.md'
permissions:
  contents: read
jobs:
  synthetic-source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify immutable daily snapshots, score timing, absence of paid odds and no-repeat requests
        run: node --test scripts/independent-sports-collect.test.mjs
      - name: Assert branch does not modify existing sports, stocks, Kalshi, Odds API or learning controllers
        run: |
          ! git diff --name-only HEAD^ HEAD | grep -E '^(src/|database/|analytics/|config/|vercel\.json$)'
