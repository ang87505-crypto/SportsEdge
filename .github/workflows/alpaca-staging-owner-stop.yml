name: Alpaca private staging controls and immutable stop
on:
  push:
    branches: ['feature/alpaca-staging-owner-stop-api-20261014']
  pull_request:
    paths:
      - 'database/staging/alpaca_paper_staging_owner_rpc_v3.sql'
      - 'database/tests/alpaca_paper_staging_owner_rpc_v3.sql'
      - 'src/lib/server/alpaca-staging-*'
      - 'src/app/api/internal/alpaca-paper/staging/**'
      - 'src/components/alpaca-staging-stop-panel.tsx'
      - '.github/workflows/alpaca-staging-owner-stop.yml'
permissions:
  contents: read
jobs:
  staging-owner-auth:
    name: Server-only staging RPC adapter, bad credentials and route auth
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Mock provider requests and verify strict owner-only boundary
        run: |
          node --experimental-strip-types --test src/lib/server/alpaca-staging-operator.test.mjs src/lib/server/alpaca-staging-route-guard.test.mjs
  staging-owner-sql:
    name: Disposable PG staging RPC access and stop audit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sportsedge_staging_owner_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sportsedge_staging_owner_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: sportsedge_staging_owner_ci
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PostgreSQL client if needed
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -qq -y postgresql-client)
      - name: Apply only copied staging migrations to disposable database
        run: |
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN;"
          psql -X -v ON_ERROR_STOP=1 -f database/staging/alpaca_paper_outbox_staging_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f database/staging/alpaca_paper_staging_halt_v2.sql
          psql -X -v ON_ERROR_STOP=1 -f database/staging/alpaca_paper_staging_owner_rpc_v3.sql
      - name: Verify STOP is server-only, permanent and append-only
        run: psql -X -v ON_ERROR_STOP=1 -f database/tests/alpaca_paper_staging_owner_rpc_v3.sql
