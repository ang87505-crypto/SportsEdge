name: Alpaca staging draft review — zero broker orders
on:
  push:
    branches: ['feature/alpaca-staging-draft-review-20261014']
  pull_request:
    paths:
      - 'database/staging/alpaca_paper_stage_draft_review_v5.sql'
      - 'database/tests/alpaca_paper_stage_draft_review_v5.sql'
      - 'src/lib/server/alpaca-staging-draft-review*'
      - 'src/app/api/internal/alpaca-paper/drafts/**'
      - 'src/components/alpaca-paper-first-test-draft.tsx'
      - '.github/workflows/alpaca-paper-staging-draft-review.yml'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --experimental-strip-types --test src/lib/server/alpaca-staging-draft-review.test.mjs src/lib/server/alpaca-paper-drafts-route-guard.test.mjs
      - name: No order submission flags activated
        run: node -e "const s=require('fs').readFileSync('src/lib/stocks/paper-automation-release.ts','utf8');for(const k of ['placeOrdersEnabled:false','scheduledOrdersEnabled:false','realMoneyEnabled:false'])if(!s.includes(k))process.exit(1);"
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sportsedge_stage_drafts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sportsedge_stage_drafts_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: sportsedge_stage_drafts_test
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -qq -y postgresql-client)
      - name: Apply five migrations to disposable database only
        run: |
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN;"
          psql -X -v ON_ERROR_STOP=1 -f database/staging/alpaca_paper_outbox_staging_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f database/staging/alpaca_paper_staging_halt_v2.sql
          psql -X -v ON_ERROR_STOP=1 -f database/staging/alpaca_paper_staging_owner_rpc_v3.sql
          psql -X -v ON_ERROR_STOP=1 -f database/staging/alpaca_paper_manual_preview_v4.sql
          psql -X -v ON_ERROR_STOP=1 -f database/staging/alpaca_paper_stage_draft_review_v5.sql
      - name: Assert readonly draft review security and locked gate
        run: psql -X -v ON_ERROR_STOP=1 -f database/tests/alpaca_paper_stage_draft_review_v5.sql
