name: Stock source and event shadow contracts
on:
  push:
    branches: ['research/stock-source-shadow-20261013']
  pull_request:
    paths:
      - 'integrations/quantconnect/**'
      - 'research/event_shadow_v1/**'
      - '.github/workflows/stock-source-shadow.yml'
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Offline synthetic tests (no secrets or market requests)
        run: |
          python3 -m compileall -q integrations/quantconnect research/event_shadow_v1
          python3 -m unittest discover -s analytics -p 'test_stock*.py'
          python3 -m unittest discover -s integrations/quantconnect -p 'test_*.py'
          python3 -m unittest discover -s integrations/quantconnect/source_audit_v2 -p 'test_*.py'
          python3 -m unittest discover -s research/event_shadow_v1 -p 'test_*.py'
