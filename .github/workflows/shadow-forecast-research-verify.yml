# Isolated research-only proof: no odds calls, DB writes, broker changes or scheduling.
name: 60 percent shadow forecast research verification
on:
  pull_request:
    paths:
      - 'src/lib/props/shadow-ledger.ts'
      - 'src/lib/props/shadow-ledger.test.mjs'
      - 'src/app/paper-betting/shadow/page.tsx'
      - 'src/app/paper-betting/predictions/page.tsx'
      - 'src/lib/navigation.ts'
      - 'docs/SPORTSEDGE_60_PERCENT_SHADOW_LEDGER_2026_11_14.md'
      - '.github/workflows/shadow-forecast-research-verify.yml'
permissions:
  contents: read
jobs:
  verify-shadow-study:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate 60 percent shadow decisions and hypothetical-only P/L
        run: node --experimental-strip-types --test src/lib/props/shadow-ledger.test.mjs
      - name: Prevent mutation of collector budgets, stock broker or research-data workflows
        if: github.event.pull_request.head.ref == 'research/all-qualified-shadow-ledger-20261114'
        run: |
          git fetch --no-tags origin main
          ! git diff --name-only origin/main...HEAD | grep -Ev '^(src/lib/props/shadow-ledger(\.test)?\.mjs|src/lib/props/shadow-ledger\.ts|src/app/paper-betting/shadow/page\.tsx|src/app/paper-betting/predictions/page\.tsx|src/lib/navigation\.ts|docs/SPORTSEDGE_60_PERCENT_SHADOW_LEDGER_2026_11_14\.md|\.github/workflows/shadow-forecast-research-verify\.yml)$'
