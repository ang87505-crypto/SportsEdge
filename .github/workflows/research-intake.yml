# AI 2.0 research intake collection (research only). Verifies real collection from free, permitted sources:
# SEC EDGAR company facts (declared User-Agent secret, <= 10 req/s) and OpenAlex/arXiv literature metadata (hypothesis-only).
# GET-only, host-allowlisted, request-budgeted; output is a workflow ARTIFACT only (no database, no branch writes).
# Not scheduled. Runs on push to the AI 2.0 intake research branch (to verify collection) and on manual dispatch.
# A schedule, or persisting datasets on the research-data branch, needs owner approval after the Monday 2026-11-16 release.
name: Research intake collect (AI 2.0, manual)
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Comma-separated tickers (current list; NOT survivorship-free)'
        required: false
        default: 'AAPL,MSFT,NVDA,JPM,XOM,JNJ,PG,KO,WMT,CAT'
  push:
    branches: [ai2/research-intake]
    paths:
      - scripts/research-intake-collect.ts
      - src/lib/research/collect.ts
      - .github/workflows/research-intake.yml
permissions:
  contents: read
concurrency:
  group: research-intake
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Intake tests before any credential is provided
        run: node --experimental-strip-types --test src/lib/research/intake-v2.test.mjs src/lib/research/collect.test.mjs
      - name: Collect (read-only, budgeted)
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
          TICKERS: ${{ inputs.tickers || 'AAPL,MSFT,NVDA,JPM,XOM,JNJ,PG,KO,WMT,CAT' }}
        run: |
          set -o pipefail
          node --experimental-strip-types --no-warnings scripts/research-intake-collect.ts --out "$RUNNER_TEMP/intake" --tickers "$TICKERS" --literature | tee -a "$GITHUB_STEP_SUMMARY"
          node -e "const r=require(process.argv[1]);console.log('INTAKE_REPORT',JSON.stringify({version:r.datasetVersion,requests:r.requests,sources:r.sources,literature:r.literature,sec:r.sec.map(s=>({t:s.ticker,facts:s.quality.facts,dropped:s.quality.dropped,restated:s.quality.periodsWithMultipleFilings,latest:s.quality.latestFiled,missing:s.quality.missingCoreTags,pit:s.pointInTime.ok,leaks:s.pointInTime.asOfLeaks,usable:s.provenance.usable}))}))" "$RUNNER_TEMP/intake/report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-intake-${{ github.run_id }}
          path: ${{ runner.temp }}/intake/
          if-no-files-found: ignore
          retention-days: 30
