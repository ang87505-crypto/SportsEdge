# Nightly read-only research collection (docs/STOCK_STRATEGY_RESEARCH_PREREG_2026_11_09.md).
# Collects QMOM's official holdings, Berkshire's SEC 13F filings (needs the SEC_EDGAR_USER_AGENT secret)
# and CUSIP mappings, advances the three forward PAPER ledgers, writes a report, and commits everything
# append-only to the research-data branch. No orders, no account data, no database, no activation.
# Schedules run from the default branch only; on this research branch it runs on push.
name: Research collect (nightly)
on:
  schedule:
    - cron: '17 2 * * 2-6'   # 02:17 UTC Tue-Sat, after each US session
  workflow_dispatch:
  pull_request:
    paths:
      - analytics/research/sec_form345.py
      - analytics/research/test_sec_form345.py
      - analytics/research/summary.py
      - analytics/research/test_summary.py
      - .github/workflows/research-collect.yml
  push:
    branches: [main, research/stock-strategy-research-20261109]
    paths:
      - analytics/research/qmom.py
      - analytics/research/sec13f.py
      - analytics/research/figi.py
      - analytics/research/store.py
      - analytics/research/fetch.py
      - analytics/research/sec_form345.py
      - analytics/research/test_sec_form345.py
      - analytics/research/summary.py
      - analytics/research/test_summary.py
      - .github/workflows/research-collect.yml
      - .github/scripts/research-data-branch.sh
permissions:
  contents: read
concurrency:
  group: research-data
  cancel-in-progress: false
jobs:
  sec-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest analytics.research.test_sec_form345 analytics.research.test_summary -v
  # A source repair on main does not rerun the stock market-data/rebalance simulations. It fetches at most
  # the SEC index plus two missing quarter archives, then regenerates source health from saved results.
  sec-source-repair:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify source contracts before giving the collector its contact identity
        run: python -m unittest analytics.research.test_sec_form345 analytics.research.test_summary -v
      - name: Check out the append-only research-data branch
        id: source_data
        run: bash .github/scripts/research-data-branch.sh checkout
      - name: Repair the public SEC quarter archives
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python -m analytics.research.sec_form345 --data research-data
      - name: Report actual source outcomes, including a failed repair
        if: always() && steps.source_data.outcome == 'success'
        run: python -m analytics.research.cli report --data research-data >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve new receipts and previous failure history
        if: always() && steps.source_data.outcome == 'success'
        run: bash .github/scripts/research-data-branch.sh commit "SEC archive source repair ${{ github.run_id }}"
  collect:
    if: github.event_name != 'pull_request' && !(github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # pushes to the research-data branch only
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Research unit tests (synthetic, no network)
        run: python -m unittest discover -s analytics/research -t .
      - name: Check out the research-data branch
        run: bash .github/scripts/research-data-branch.sh checkout
      - name: Collect sources (read-only)
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python -m analytics.research.cli collect --data research-data
      - name: Verify or collect the latest closed SEC insider quarters
        # Independent optional research input. Its recorded failure must not stop unrelated forward ledgers.
        continue-on-error: true
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python -m analytics.research.sec_form345 --data research-data
      - name: Advance the forward PAPER ledgers (read-only market data)
        env:
          ALPACA_PAPER_AUTO_KEY_ID: ${{ secrets.ALPACA_PAPER_AUTO_KEY_ID }}
          ALPACA_PAPER_AUTO_SECRET_KEY: ${{ secrets.ALPACA_PAPER_AUTO_SECRET_KEY }}
        run: python -m analytics.research.cli forward --data research-data
      - name: Daily strategies - simulated forward ledgers (docs/STOCK_DAILY_STRATEGIES_PREREG_2026_11_10.md)
        env:
          ALPACA_PAPER_AUTO_KEY_ID: ${{ secrets.ALPACA_PAPER_AUTO_KEY_ID }}
          ALPACA_PAPER_AUTO_SECRET_KEY: ${{ secrets.ALPACA_PAPER_AUTO_SECRET_KEY }}
        run: |
          # The 10-year historical test runs once here (then monthly in research-evaluate).
          if ! ls research-data/results/daily-historical-*.json >/dev/null 2>&1; then
            python -m analytics.research.cli daily-historical --data research-data --end 2026-11-06
          fi
          python -m analytics.research.cli daily-forward --data research-data
      - name: SPY turn-of-the-month - simulated forward ledger (docs/STOCK_TOM_PREREG_2026_11_10.md)
        env:
          ALPACA_PAPER_AUTO_KEY_ID: ${{ secrets.ALPACA_PAPER_AUTO_KEY_ID }}
          ALPACA_PAPER_AUTO_SECRET_KEY: ${{ secrets.ALPACA_PAPER_AUTO_SECRET_KEY }}
        run: |
          if ! ls research-data/results/tom-historical-*.json >/dev/null 2>&1; then
            python -m analytics.research.cli tom-historical --data research-data --end 2026-11-06
          fi
          python -m analytics.research.cli tom-forward --data research-data
      - name: AI Learning Lab - stock behaviour ablation and frozen forward picks (research only)
        # Freezes each variant's picks for the next weekly decision before it opens (append-only), grades past weeks,
        # and runs the 10-year ablation once (then monthly). Read-only market data; never orders, never the live strategy.
        continue-on-error: true
        env:
          ALPACA_PAPER_AUTO_KEY_ID: ${{ secrets.ALPACA_PAPER_AUTO_KEY_ID }}
          ALPACA_PAPER_AUTO_SECRET_KEY: ${{ secrets.ALPACA_PAPER_AUTO_SECRET_KEY }}
        run: |
          if ! ls research-data/results/lab-historical-*.json >/dev/null 2>&1; then
            python -m analytics.research.cli lab-historical --data research-data --end 2026-11-06
          fi
          python -m analytics.research.cli lab-forward --data research-data
      - name: Report
        run: python -m analytics.research.cli report --data research-data >> "$GITHUB_STEP_SUMMARY"
      - name: Commit append-only to research-data
        if: always()
        run: bash .github/scripts/research-data-branch.sh commit "collect ${{ github.run_id }}"
