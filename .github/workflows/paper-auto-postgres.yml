name: Recurring PAPER controller SQL safety
on:
  pull_request:
    paths:
      - 'database/staging/paper_auto_v1.sql'
      - 'database/staging/paper_auto_risk_v2.sql'
      - 'database/staging/paper_auto_models_v3.sql'
      - 'database/tests/paper_auto_v1*'
      - '.github/workflows/paper-auto-postgres.yml'
permissions:
  contents: read
jobs:
  isolated-db:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sportsedge_paper_auto_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sportsedge_paper_auto_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: sportsedge_paper_auto_ci
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -qq -y postgresql-client)
      - name: Apply the recurring controller schema to a disposable database
        run: |
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN;"
          psql -X -q -v ON_ERROR_STOP=1 -f database/staging/paper_auto_v1.sql
      - name: Prove STOP, leases, claims, caps, receipts and ledger rules with a pinned clock
        run: psql -X -q -v ON_ERROR_STOP=1 -f database/tests/paper_auto_v1.sql
      - name: Upgrade the pinned previous v1 schema twice and rerun the contract
        run: |
          psql -X -v ON_ERROR_STOP=1 -c "CREATE DATABASE sportsedge_paper_auto_upgrade"
          git show b680bf18a907e77cf5026b6bdd31449bbc913b36:database/staging/paper_auto_v1.sql > "$RUNNER_TEMP/paper_auto_previous_v1.sql"
          PGDATABASE=sportsedge_paper_auto_upgrade psql -X -q -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/paper_auto_previous_v1.sql"
          PGDATABASE=sportsedge_paper_auto_upgrade psql -X -q -v ON_ERROR_STOP=1 -f database/staging/paper_auto_risk_v2.sql
          PGDATABASE=sportsedge_paper_auto_upgrade psql -X -q -v ON_ERROR_STOP=1 -f database/staging/paper_auto_risk_v2.sql
          PGDATABASE=sportsedge_paper_auto_upgrade psql -X -q -v ON_ERROR_STOP=1 -f database/staging/paper_auto_models_v3.sql
          PGDATABASE=sportsedge_paper_auto_upgrade psql -X -q -v ON_ERROR_STOP=1 -f database/tests/paper_auto_v1.sql
      - name: Upgrade the installed staging schema (main before the steady-stocks model) twice and rerun the contract
        run: |
          psql -X -v ON_ERROR_STOP=1 -c "CREATE DATABASE sportsedge_paper_auto_models"
          git show 5a5df00fa860394516ee3ce4a7d498a543c7e5c1:database/staging/paper_auto_v1.sql > "$RUNNER_TEMP/paper_auto_installed_v1.sql"
          PGDATABASE=sportsedge_paper_auto_models psql -X -q -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/paper_auto_installed_v1.sql"
          PGDATABASE=sportsedge_paper_auto_models psql -X -q -v ON_ERROR_STOP=1 -f database/staging/paper_auto_models_v3.sql
          PGDATABASE=sportsedge_paper_auto_models psql -X -q -v ON_ERROR_STOP=1 -f database/staging/paper_auto_models_v3.sql
          PGDATABASE=sportsedge_paper_auto_models psql -X -q -v ON_ERROR_STOP=1 -f database/tests/paper_auto_v1.sql
      - name: Race RPCs across independent connections
        run: |
          psql -X -v ON_ERROR_STOP=1 -c "CREATE DATABASE sportsedge_paper_auto_race"
          PGDATABASE=sportsedge_paper_auto_race psql -X -q -v ON_ERROR_STOP=1 -f database/staging/paper_auto_v1.sql
          PGDATABASE=sportsedge_paper_auto_race bash database/tests/paper_auto_v1_race.sh
