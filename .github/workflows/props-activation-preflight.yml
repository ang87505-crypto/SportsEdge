# Read-only preflight for the props capture activation (docs/PROPS_CAPTURE_ACTIVATION_CHECKLIST_2026_11_11.md).
# Every database request is a PostgREST GET; no RPC, no write, no Odds API call, no secret printed. Run it before
# and after each activation step: it reports whether props_capture_v1 and v3 accounting are applied, the active
# budget policy, real rolling credit use, duplicate and entry-cap checks, settlement recency, and whether the live
# site's budget answer matches the ledger.
name: Props activation preflight (read-only)
on:
  workflow_dispatch:
    inputs:
      ledger_from:
        description: Ledger audit start (UTC date, YYYY-MM-DD); entries and runs from this date
        required: false
        type: string
      ledger_to:
        description: Ledger audit end (UTC date, exclusive); default tomorrow
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: props-activation-preflight
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit tests (GET-only guards, accounting, verdicts, re-grading)
        run: |
          node --test scripts/props-activation-preflight.test.mjs
          node --experimental-strip-types --no-warnings --test scripts/props-ledger-verify.test.mjs scripts/props-calibration-audit.test.mjs
      - name: Read-only checks against the props database
        env:
          SPORTSEDGE_PROPS_SUPABASE_URL: ${{ secrets.SPORTSEDGE_PROPS_SUPABASE_URL }}
          SPORTSEDGE_PROPS_SUPABASE_SERVICE_KEY: ${{ secrets.SPORTSEDGE_PROPS_SUPABASE_SERVICE_KEY }}
        run: |
          node scripts/props-activation-preflight.mjs preflight.json > /dev/null
          node -e '
           const f=require("./preflight.json");
           const lines=["## Props activation preflight ("+f.at+")","","| Check | State | Detail |","|---|---|---|",
            ...f.verdict.map(v=>"| "+v.id+" | "+v.state+" | "+v.detail+" |"),"",
            "Credits: "+JSON.stringify(f.credits),"","Site budget reply matches ledger: "+f.siteMatchesLedger,"",
            "Recent runs: "+JSON.stringify(f.recentRuns)];
           require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join("\n")+"\n");'
          cat preflight.json
      - name: Ledger audit (read-only) - entries, legs, independent re-grades from box scores, settlements, bankrolls
        env:
          SPORTSEDGE_PROPS_SUPABASE_URL: ${{ secrets.SPORTSEDGE_PROPS_SUPABASE_URL }}
          SPORTSEDGE_PROPS_SUPABASE_SERVICE_KEY: ${{ secrets.SPORTSEDGE_PROPS_SUPABASE_SERVICE_KEY }}
          FROM: ${{ inputs.ledger_from || '2026-11-09' }}
          TO: ${{ inputs.ledger_to }}
        run: node --experimental-strip-types --no-warnings scripts/props-ledger-verify.mjs
      - name: Calibration and accounting audit (read-only) - all recorded predictions, picks, buckets, groups, expected vs realised
        env:
          SPORTSEDGE_PROPS_SUPABASE_URL: ${{ secrets.SPORTSEDGE_PROPS_SUPABASE_URL }}
          SPORTSEDGE_PROPS_SUPABASE_SERVICE_KEY: ${{ secrets.SPORTSEDGE_PROPS_SUPABASE_SERVICE_KEY }}
          FROM: '2026-11-01'
        run: node --experimental-strip-types --no-warnings scripts/props-calibration-audit.mjs
