name: Alpaca owner one-order staging SQL safety
on:
  push:
    branches: ['feature/alpaca-paper-owner-one-order-20261014']
  pull_request:
    paths:
      - 'database/staging/alpaca_paper_first_order_v6.sql'
      - 'database/tests/alpaca_paper_first_order_v6.sql'
      - '.github/workflows/alpaca-owner-one-order-postgres.yml'
permissions:
  contents: read
jobs:
  isolated-staging-db:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sportsedge_one_shot_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sportsedge_one_shot_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: sportsedge_one_shot_ci
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -qq -y postgresql-client)
      - name: Create disposable staging mirror v1 through v6
        run: |
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN;"
          for f in database/staging/alpaca_paper_outbox_staging_v1.sql database/staging/alpaca_paper_staging_halt_v2.sql database/staging/alpaca_paper_staging_owner_rpc_v3.sql database/staging/alpaca_paper_manual_preview_v4.sql database/staging/alpaca_paper_stage_draft_review_v5.sql database/staging/alpaca_paper_first_order_v6.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$f" || exit 1
          done
      - name: Prove approval uniqueness, stop, CAS, no rearm, RLS
        run: psql -X -v ON_ERROR_STOP=1 -f database/tests/alpaca_paper_first_order_v6.sql
