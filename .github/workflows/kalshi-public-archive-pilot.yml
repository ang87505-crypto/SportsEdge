name: Independent weather archive retrieval pilot
on:
  pull_request:
    paths:
      - '.github/workflows/kalshi-public-archive-pilot.yml'
  workflow_dispatch:
    inputs:
      start:
        description: First target climate date (inclusive, YYYY-MM-DD)
        required: true
        default: '2024-01-01'
        type: string
      end:
        description: Last target climate date (inclusive, YYYY-MM-DD)
        required: true
        default: '2024-12-31'
        type: string
      station:
        description: KNYC only; CLINYC outcome binding is fixed
        required: true
        default: KNYC
        type: string
  workflow_call:
    inputs:
      start:
        required: true
        type: string
      end:
        required: true
        type: string
      station:
        required: true
        type: string
    outputs:
      artifact_name:
        description: Name of receipt and raw archive artifact
        value: ${{ jobs.retrieve.outputs.artifact_name }}
permissions:
  contents: read
jobs:
  retrieve:
    concurrency:
      group: independent-weather-archive-provider
      cancel-in-progress: false
    outputs:
      artifact_name: ${{ steps.artifact.outputs.artifact_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Acquire bounded public NWS archive sample
        env:
          # PR checks use a bounded recent historical rehearsal, not a repeat of the full-year archive.
          START_DATE: ${{ inputs.start || '2026-10-11' }}
          END_DATE: ${{ inputs.end || '2026-11-25' }}
          STATION: ${{ inputs.station || 'KNYC' }}
        run: |
          python3 - <<'PY'
          import csv, datetime, hashlib, io, json, os, pathlib, re, urllib.parse, urllib.request, urllib.error, time, zipfile

          out = pathlib.Path("weather-archive-pilot")
          out.mkdir(exist_ok=True)
          root = "https://mesonet.agron.iastate.edu"
          limit = 16 * 1024 * 1024
          requests = []
          # Only Central Park has a validated CLI outcome binding. Never label another station's data KNYC.
          def parse_date(value):
              if not re.fullmatch(r"\d{4}-\d{2}-\d{2}", value):
                  raise ValueError("invalid ISO climate date")
              return datetime.date.fromisoformat(value)
          start, end = parse_date(os.environ["START_DATE"]), parse_date(os.environ["END_DATE"])
          if os.environ["STATION"] != "KNYC" or not 0 <= (end-start).days < 500:
              raise ValueError("only KNYC and 1–500 inclusive target days supported")
          utc_now = datetime.datetime.now(datetime.timezone.utc)
          if start > utc_now.date() or end > utc_now.date()+datetime.timedelta(days=1):
              raise ValueError("future range exceeds next-day forecast target")
          day = datetime.timedelta(days=1)
          stamp = lambda d: d.isoformat()+"T00:00Z"
          for model in ("GFS", "NBS"):
              params = {"station":"KNYC","model":model,"sts":stamp(start-2*day),"ets":stamp(min(end+day,utc_now.date()+day)),"format":"csv"}
              requests.append((model.lower()+"-"+start.isoformat()+"-"+end.isoformat()+".csv", "/cgi-bin/request/mos.py", params))
          # Include next morning's report for the last requested date, without fetching future products.
          cli_start=start+day
          cli_end=min(end+2*day,utc_now.date()+day)
          if cli_start>=cli_end:
              raise ValueError("no observable CLI date window")
          requests.append(("clin-yc-"+start.isoformat()+"-"+end.isoformat()+".zip", "/cgi-bin/afos/retrieve.py", {"pil":"CLINYC","center":"KOKX","fmt":"zip","sdate":stamp(cli_start),"edate":stamp(cli_end),"limit":"9999"}))
          receipt = {"schema":"weather-archive-retrieval-pilot-v1","purpose":"raw retrieval only; not training pairs, calibrated probabilities or exchange data","started_at":utc_now.isoformat(),"target_start":start.isoformat(),"target_end":end.isoformat(),"station":"KNYC","admitted_training_pairs":0,"exchange_requests":0,"files":[]}
          cooldown = False
          for i, (name, endpoint, params) in enumerate(requests):
              url = root + endpoint + "?" + urllib.parse.urlencode(params)
              row = {"name":name,"source_url":url}
              if cooldown:
                  row.update(status="DEFERRED_RATE_LIMIT", error="Stopped after server rate limit; no request sent")
                  receipt["files"].append(row)
                  print(json.dumps(row),flush=True)
                  continue
              # Three bulk requests instead of seven immediate requests. Conservative pacing;
              # no automatic retries or alternate hosts when the server refuses traffic.
              if i:
                  time.sleep(90)
              try:
                  req = urllib.request.Request(url, headers={"User-Agent":"SportsEdge independent weather research archive pilot/1.0"})
                  with urllib.request.urlopen(req, timeout=40) as response:
                      row["http_status"] = response.status
                      row["resolved_url"] = response.geturl()
                      if urllib.parse.urlsplit(response.geturl()).hostname != "mesonet.agron.iastate.edu":
                          raise ValueError("unexpected redirect host")
                      data = response.read(limit+1)
                  if not data or len(data)>limit:
                      raise ValueError("empty or oversized archive")
                  if name.endswith(".csv"):
                      reader = csv.reader(io.StringIO(data.decode("utf-8-sig")))
                      header = next(reader)
                      count = sum(1 for fields in reader if len(fields)==len(header) and fields)
                      if len(header)<3 or count==0 or b"KNYC" not in data:
                          raise ValueError("missing station data or unexpected CSV")
                      row.update(columns=header,raw_rows=count)
                  else:
                      with zipfile.ZipFile(io.BytesIO(data)) as archive:
                          members = [x for x in archive.infolist() if not x.is_dir()]
                          if not members or sum(x.file_size for x in members)>64*1024*1024:
                              raise ValueError("empty or oversized CLI archive")
                          # Do not extract paths. Retain archive names for subsequent issue-clock validation.
                          row.update(raw_products=len(members),sample_member_names=[x.filename for x in members[:5]])
                  (out/name).write_bytes(data)
                  row.update(status="RETRIEVED_UNVALIDATED",bytes=len(data),sha256=hashlib.sha256(data).hexdigest(),captured_at=datetime.datetime.now(datetime.timezone.utc).isoformat())
              except urllib.error.HTTPError as exc:
                  row.update(status="FAILED",http_status=exc.code,error=str(exc)[:400])
                  if exc.code == 429:
                      cooldown = True
                      row["retry_after"] = exc.headers.get("Retry-After")
              except Exception as exc:
                  row.update(status="FAILED",error=str(exc)[:400])
              receipt["files"].append(row)
              print(json.dumps(row),flush=True)
          receipt["retrieved_at"]=datetime.datetime.now(datetime.timezone.utc).isoformat()
          receipt["status"]="RETRIEVED_UNVALIDATED" if all(x["status"]=="RETRIEVED_UNVALIDATED" for x in receipt["files"]) else "INCOMPLETE"
          (out/"receipt.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print(json.dumps(receipt),flush=True)
          if receipt["status"]!="RETRIEVED_UNVALIDATED":
              raise SystemExit(1)
          PY
      - name: Preserve raw public archives and receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: independent-weather-archive-pilot
          path: weather-archive-pilot/
          if-no-files-found: error
          retention-days: 30
      - name: Declare artifact output
        id: artifact
        run: echo "artifact_name=independent-weather-archive-pilot" >> "$GITHUB_OUTPUT"
