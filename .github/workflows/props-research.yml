name: NBA props research receipts
on:
  schedule:
    - cron: '45 15 * * *'
    - cron: '25 19 * * *'
    - cron: '25 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/lib/props/research*'
      - 'src/lib/server/props-research*'
      - 'scripts/props-research-snapshot.ts'
      - 'src/data/props/research_v2.json'
      - '.github/workflows/props-research.yml'
  pull_request:
    paths:
      - 'src/lib/props/research*'
      - 'src/lib/server/props-research*'
      - 'scripts/props-calibration-study.ts'
      - 'scripts/props-research-snapshot.ts'
      - 'src/data/props/research_v2.json'
      - 'research/props_calibration_20261108/**'
      - '.github/workflows/props-research.yml'
permissions:
  contents: read
concurrency:
  group: props-research-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: node --experimental-strip-types --test src/lib/props/research.test.mjs src/lib/server/props-research-data.test.mjs
  snapshot:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Snapshot existing observations and final grades
        env:
          SPORTSEDGE_PROPS_SUPABASE_URL: ${{ secrets.SPORTSEDGE_PROPS_SUPABASE_URL }}
          SPORTSEDGE_PROPS_SUPABASE_SERVICE_KEY: ${{ secrets.SPORTSEDGE_PROPS_SUPABASE_SERVICE_KEY }}
        run: node --experimental-strip-types scripts/props-research-snapshot.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: props-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/props-research/snapshot.json
          if-no-files-found: error
          retention-days: 90
