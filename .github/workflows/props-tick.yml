# NBA player-prop PAPER capture ticks (props-capture-v1; src/lib/props/capture-plan.ts).
# Virtual entries only: no DFS account, no deposits, no real-money entries.
# RELEASED OFF: while PROPS_COLLECTION_V2.tickEnabled is false (src/lib/props/schedule.ts) every scheduled or
# backup tick exits before any database or provider call. Enabling it is an owner decision.
# A tick is idempotent: it only captures games whose own window is open, a second start in the same
# 30-minute bucket is refused by the run ledger (DUPLICATE/BUSY), and each capture is claimed before any
# paid request. GitHub often starts these late or drops them; the Vercel backups (scheduler-kickoff.ts)
# dispatch the same tick at fixed hours.
name: NBA props capture tick
on:
  schedule:
    - cron: '7,37 11-23 * * *'
    - cron: '7,37 0-4 * * *'
  workflow_dispatch:
    inputs:
      trigger:
        description: manual (owner) or backup (Vercel scheduler only)
        required: true
        type: choice
        options: [manual, backup]
        default: manual
      scheduled_hour:
        description: Backup only - the UTC hour the Vercel cron was scheduled for (YYYY-MM-DDTHH:00:00Z)
        required: false
        type: string
permissions:
  contents: read
# Own group: GitHub cancels any PENDING run in a group when a newer one queues, so sharing props-paper would let a
# burst of delayed ticks cancel a pending settle or collect. Ticks and slot collects are serialized by the database
# instead (one running collect run at a time: BUSY/DUPLICATE), and a cancelled pending tick is harmless.
concurrency:
  group: props-tick
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run one capture tick
        env:
          TICK_TRIGGER: ${{ inputs.trigger || 'schedule' }}
          TICK_SCHEDULED_HOUR: ${{ inputs.scheduled_hour }}
          SPORTSEDGE_PROPS_SUPABASE_URL: ${{ secrets.SPORTSEDGE_PROPS_SUPABASE_URL }}
          SPORTSEDGE_PROPS_SUPABASE_SERVICE_KEY: ${{ secrets.SPORTSEDGE_PROPS_SUPABASE_SERVICE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node --experimental-strip-types scripts/props-worker.ts tick
      # AI Learning Lab (RESEARCH ONLY): freeze every ablation variant and the pre-lock risk flags for lines this
      # tick stored, using database rows only (zero provider requests). It never records a pick, entry or stake,
      # exits 0 when the lab tables are not migrated, and cannot fail the paper tick (continue-on-error).
      - name: Learning Lab freeze (research only)
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        env:
          SPORTSEDGE_PROPS_SUPABASE_URL: ${{ secrets.SPORTSEDGE_PROPS_SUPABASE_URL }}
          SPORTSEDGE_PROPS_SUPABASE_SERVICE_KEY: ${{ secrets.SPORTSEDGE_PROPS_SUPABASE_SERVICE_KEY }}
        run: |
          node --experimental-strip-types scripts/lab-sports.ts freeze
          # Once a day, after the morning settle has graded last night's lines: the forward comparison report.
          if [ "$(date -u +%H)" = "11" ]; then node --experimental-strip-types scripts/lab-sports.ts report; fi
