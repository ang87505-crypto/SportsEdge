name: QuantConnect read-only connector verification
on:
  pull_request:
    paths:
      - 'src/lib/server/quantconnect-client.ts'
      - 'src/lib/server/quantconnect-client.test.mjs'
      - 'src/app/api/internal/quantconnect/route.ts'
      - '.github/workflows/quantconnect-readonly.yml'
  push:
    branches: ['research/quantconnect-readonly-connection-20261013']
permissions:
  contents: read
jobs:
  connector-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Type-stripped deterministic read-only client checks
        run: node --experimental-strip-types --test src/lib/server/quantconnect-client.test.mjs
