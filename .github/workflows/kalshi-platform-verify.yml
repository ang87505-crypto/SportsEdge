name: Kalshi private paper platform verification
on:
  pull_request:
    paths:
      - 'src/lib/server/kalshi-*'
      - 'src/lib/prediction-markets/kalshi/**'
      - 'src/components/kalshi-paper-panel.tsx'
      - 'src/app/api/internal/kalshi-paper/**'
      - 'src/app/prediction-markets/kalshi/**'
      - 'database/kalshi/**'
      - 'scripts/verify-kalshi-platform-sql.py'
      - 'scripts/kalshi-paper-replay.ts'
      - 'scripts/kalshi-independent-weather-collect.test.mjs'
      - '.github/workflows/kalshi-platform-verify.yml'
      - '.github/workflows/kalshi-independent-weather-memory.yml'
      - 'vercel.json'
permissions:
  contents: read
jobs:
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated SQL test driver
        run: python -m pip install 'psycopg[binary]==3.3.9'
      - name: Private grants, immutable data, leases, forward clocks and concurrent demo intents
        env:
          KALSHI_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: python scripts/verify-kalshi-platform-sql.py
      - name: Offline sources, model, money, auth, lost replies and demo lifecycle
        run: >-
          node --experimental-strip-types --test
          src/lib/prediction-markets/kalshi/*.test.mjs src/lib/server/kalshi-*.test.mjs
          scripts/kalshi-independent-weather-collect.test.mjs scripts/kalshi-weather-contract-eval.test.mjs
