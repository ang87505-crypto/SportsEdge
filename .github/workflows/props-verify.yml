name: NBA props paper verification
on:
  pull_request:
    paths:
      - 'src/lib/props/**'
      - 'src/lib/assistant/**'
      - 'src/lib/server/assistant-*'
      - 'src/app/api/assistant/**'
      - 'src/lib/server/props-*'
      - 'src/app/paper-betting/props/**'
      - 'src/data/props/**'
      - 'database/props/**'
      - 'scripts/props-*'
      - 'scripts/lib/**'
      - 'scripts/box-csv.test.mjs'
      - '.github/workflows/props-*.yml'
      - 'src/lib/server/scheduler-kickoff*'
      - 'src/components/props-*'
      - 'src/app/automation/**'
      - 'vercel.json'
      - 'research/props_collection_timing_*/**'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit tests (normalizer, budget, model, grading, entries, schedule)
        run: node --experimental-strip-types --test src/lib/props/*.test.mjs scripts/box-csv.test.mjs src/lib/assistant/*.test.mjs src/lib/server/assistant-handler.test.mjs src/lib/server/props-owner.test.mjs src/lib/server/props-active-model.test.mjs src/lib/server/props-learn-worker.test.mjs src/lib/server/props-learn-dispatch.test.mjs src/lib/server/props-learn-data.test.mjs src/lib/server/props-dashboard-load.test.mjs scripts/props-learn.test.mjs src/lib/paper-automation-view.test.mjs src/lib/server/scheduler-kickoff.test.mjs
      - name: SQL contract and end-to-end tests on disposable PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -E env "PATH=$PATH" bash scripts/verify-props-sql.sh
