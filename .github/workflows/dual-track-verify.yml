name: Verify dual-track data foundation

on:
  pull_request:
  push:
    branches:
      - feature/dual-track-data-foundation

permissions:
  contents: read

jobs:
  normalize:
    name: NBA and soccer provider-contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate normalized market data (synthetic fixtures only)
        run: node --test src/lib/ingestion/normalize.test.mjs
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
