name: Independent build and audit

on:
  pull_request:
  push:
    branches:
      - audit-six-month-backtest

permissions:
  contents: read

# The Next.js build runs once per PR in verify.yml; this workflow keeps only
# the independent replay of pinned match history.
jobs:

  reproduce:
    name: Replay pinned public-domain match history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python analytics/verify_reproduced_snapshot.py
