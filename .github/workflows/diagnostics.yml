name: Independent build and audit

on:
  pull_request:
  push:
    branches:
      - audit-six-month-backtest

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # The same PR tree is built by Verify SportsEdge and browser QA.
    # Preserve the independent build for the legacy push-only entry point.
    if: github.event_name == 'push'
    name: Isolated Next.js build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build

  reproduce:
    name: Replay pinned public-domain match history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python analytics/verify_reproduced_snapshot.py
