# Recurring Alpaca PAPER worker. Manual dispatch, plus a schedule (owner-approved
# 2026-10-31) for stock-v2-weekly-1. Scheduled execute runs trade only while the owner has
# armed the gate and broker writes are released; otherwise they block or record a shadow plan.
# Times are UTC and cover both New York offsets; the worker re-checks every session and window.
#   execute: 09:50 ET (13:50 / 14:50 UTC), then 15:20-18:20 UTC to re-plan resting residuals
#   monitor: after the close (20:35 / 21:35 UTC; an early one skips as BEFORE_CLOSE)
name: Recurring PAPER worker (manual)
on:
  schedule:
    - cron: '50 13,14 * * 1-5'
    - cron: '20 15,16,17,18 * * 1-5'
    - cron: '35 20,21 * * 1-5'
  workflow_dispatch:
    inputs:
      kind:
        description: Run kind (execute records only a shadow plan while writes are released OFF)
        required: true
        type: choice
        options: [reconcile, monitor, execute]
      experiment:
        description: Registered experiment id
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: paper-auto-${{ inputs.experiment || 'stock-v2-weekly-1' }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run one slot
        env:
          KIND: ${{ inputs.kind || (github.event.schedule == '35 20,21 * * 1-5' && 'monitor' || 'execute') }}
          EXPERIMENT: ${{ inputs.experiment || 'stock-v2-weekly-1' }}
          SPORTSEDGE_STAGING_SUPABASE_URL: ${{ secrets.SPORTSEDGE_STAGING_SUPABASE_URL }}
          SPORTSEDGE_STAGING_SUPABASE_SERVICE_KEY: ${{ secrets.SPORTSEDGE_STAGING_SUPABASE_SERVICE_KEY }}
          ALPACA_PAPER_AUTO_KEY_ID: ${{ secrets.ALPACA_PAPER_AUTO_KEY_ID }}
          ALPACA_PAPER_AUTO_SECRET_KEY: ${{ secrets.ALPACA_PAPER_AUTO_SECRET_KEY }}
        run: node --experimental-strip-types scripts/paper-auto-worker.ts "$KIND" --experiment "$EXPERIMENT"
