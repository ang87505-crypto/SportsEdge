# Recurring Alpaca PAPER worker. Manual dispatch only: there is deliberately no
# schedule here. Scheduled runs and broker writes are also released OFF in
# src/lib/stocks/paper-auto-release.ts; see docs/PAPER_AUTO_RELEASE_CHECKLIST_2026_10_17.md.
name: Recurring PAPER worker (manual)
on:
  workflow_dispatch:
    inputs:
      kind:
        description: Run kind (execute records only a shadow plan while writes are released OFF)
        required: true
        type: choice
        options: [reconcile, monitor, execute]
      experiment:
        description: Registered experiment id
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: paper-auto-${{ inputs.experiment }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run one slot
        env:
          KIND: ${{ inputs.kind }}
          EXPERIMENT: ${{ inputs.experiment }}
          SPORTSEDGE_STAGING_SUPABASE_URL: ${{ secrets.SPORTSEDGE_STAGING_SUPABASE_URL }}
          SPORTSEDGE_STAGING_SUPABASE_SERVICE_KEY: ${{ secrets.SPORTSEDGE_STAGING_SUPABASE_SERVICE_KEY }}
          ALPACA_PAPER_AUTO_KEY_ID: ${{ secrets.ALPACA_PAPER_AUTO_KEY_ID }}
          ALPACA_PAPER_AUTO_SECRET_KEY: ${{ secrets.ALPACA_PAPER_AUTO_SECRET_KEY }}
        run: node --experimental-strip-types scripts/paper-auto-worker.ts "$KIND" --experiment "$EXPERIMENT"
